name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'AUTHOR.md'
      - 'LICENSE'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Accept licenses
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Ensure platforms and build-tools are present
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Install NPM dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx tauri android init --ci
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' src-tauri/gen/android/app/src/main/AndroidManifest.xml || true
          npx tauri android build --apk --ci

      - name: Auto-Sign Android APK
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*unsigned.apk" | while read -r apk; do
            signed_apk="${apk%-unsigned.apk}-signed.apk"
            echo "Signing $apk -> $signed_apk"
            /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out "$signed_apk" "$apk" || true
            cp -f "$signed_apk" "$apk"
          done


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-Planner-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
