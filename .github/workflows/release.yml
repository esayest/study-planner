name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install NPM dependencies
        run: npm install

      - name: Build Windows Installers
        run: npx tauri build

      - name: Stage Windows Artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/nsis/*.exe release-assets/Study-Planner-${{ github.ref_name || inputs.tag_name }}-Setup.exe || true
          cp src-tauri/target/release/bundle/msi/*.msi release-assets/Study-Planner-${{ github.ref_name || inputs.tag_name }}.msi || true

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Install NPM dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --ci

      - name: Stage Android Artifact
        run: |
          mkdir -p release-assets
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk release-assets/Study-Planner-${{ github.ref_name || inputs.tag_name }}.apk || cp src-tauri/gen/android/app/build/outputs/apk/**/*.apk release-assets/Study-Planner-${{ github.ref_name || inputs.tag_name }}.apk

      - name: Upload Android Asset
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: release-assets/*

  publish:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: Study Planner ${{ github.ref_name || inputs.tag_name }}
          files: downloaded-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
